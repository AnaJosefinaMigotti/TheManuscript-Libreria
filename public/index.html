<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Manuscript - Librería</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>
        <div class="cabecera-superior">
            <div class="marca">
                <img
                    src="imagenes/logo.png"
                    alt="The Manuscript - Librería"
                    class="logo"
                >
            </div>
        </div>
    </header>

    <main>
        <section id="bienvenida">

            <h2>Bienvenido a The Manuscript</h2>

            <p>
                Ingresá con tu correo electrónico y contraseña
                para acceder a la librería.
            </p>

            <form id="formulario-login">

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Correo electrónico"
                    autocomplete="username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="ingresar">
                    Ingresar
                </button>

            </form>

            <p id="mensaje-login" role="alert"></p>

        </section>
    </main>

    <footer>
        <p>all's fair in love and poetry</p>
    </footer>

    <script src="app.js"></script>

</body>
</html>
